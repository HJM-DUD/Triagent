<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Triagent Observer</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <header class="topbar">
          <div class="brand-lockup">
            <span class="brand-mark" aria-hidden="true"></span>
            <div>
              <p class="eyebrow">AI Command Center</p>
              <h1>Triagent</h1>
            </div>
          </div>
          <span id="connection" class="badge connection-badge">connecting</span>
        </header>
        <div class="sidebar-label">
          <span>任务流</span>
          <span id="task-count" class="task-count">0 shown</span>
          <button id="task-toggle" class="task-toggle" type="button" hidden>全部</button>
          <span class="label-line" aria-hidden="true"></span>
        </div>
        <section id="tasks" class="task-list" aria-label="任务列表"></section>
      </aside>
      <section class="workspace">
        <header class="detail-header">
          <div class="detail-copy">
            <p class="eyebrow">当前观察目标</p>
            <h2 id="selected-title">等待子agent任务</h2>
            <p id="selected-agent" class="meta">未选择任务</p>
          </div>
          <div class="detail-actions">
            <button id="apply-command" class="action-button" type="button" hidden>Apply</button>
            <span id="selected-status" class="status">idle</span>
          </div>
        </header>
        <section class="panes">
          <article class="pane">
            <header class="pane-header">
              <h3>任务包</h3>
              <span>Task Packet</span>
            </header>
            <pre id="task-packet" class="terminal packet-terminal muted">选择左侧任务后显示</pre>
          </article>
          <article class="pane output-pane">
            <header class="pane-header">
              <h3>原始输出</h3>
              <span>Raw Stream</span>
            </header>
            <div id="events" class="terminal event-stream" aria-live="polite"></div>
          </article>
        </section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
